[package]
description = "parser combinators for rust language."
documentation = "https://docs.rs/parserc"
edition = "2024"
license = "MIT"
name = "parserc"
repository = "https://github.com/stylang/parserc/crates/parserc"
version.workspace = true

[dependencies]
thiserror = { workspace = true }
sourceinput = { workspace = true }
parserc-derive = { workspace = true, optional = true}
serde = { version = "1.0.228", optional = true }

[features]
default = ["serde","combinators","syntax","derive"]
serde = ["dep:serde","serde/derive"]
combinators = []
syntax = ["parserc-derive"]
derive = ["syntax"]
