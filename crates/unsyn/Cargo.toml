[package]
description = "A DSL for specifying concrete syntax trees."
documentation = "https://docs.rs/unsyn"
edition = "2024"
license = "MIT"
name = "unsyn"
repository = "https://github.com/stylang/stylang/crates/unsyn"
version.workspace = true

[dependencies]
unicode-ident = { version = "1.0.22", optional = true }
parserc = { path = "../parserc", version = "^0.13", default-features = false, features = ["input"] }
serde = { version = "1.0.228", optional = true }
thiserror = { version = "2.0.17", optional = true }
proc-macro2 = { version = "^1", optional = true }
quote = { version = "^1", optional = true }

[dev-dependencies]
walkdir = "2"
syn = { version = "^2", features = ["full"] }

# The crate has two phases, and they are the two features that say so:
# `runtimes` is the side a generated grammar belongs to, `compiler` is the
# DSL front end and the generator that writes one. Neither builds on the other:
# the generator only writes the names of parserc items into the text it emits,
# so a proc macro that produces a grammar leaves the runtime out of its own
# tree, and a crate that only keeps a generated file needs no unsyn at all.
# The defaults carry both because a test here compiles a generated file, which
# needs a runtime to compile it against.
[features]
default = ["serde", "compiler", "runtimes"]
runtimes = []
# The bootstrap comparison: the crate's own analysis, compiled a second time
# over the front end a build wrote. Inert by default because the loop is the
# work in BOOTSTRAP_LOG.md and does not close yet; `--all-targets` must stay
# green while the distance is being counted down.
bootstrap = ["compiler"]
compiler = ["dep:proc-macro2", "dep:quote", "dep:thiserror", "dep:unicode-ident", "parserc/syntax"]
serde = ["dep:serde", "parserc/serde"]

# The generated file is the code of a spec that calls two externals, and only the
# generator writes it; without the feature there is nothing to check.
[[test]]
name = "unsyn_us"
required-features = ["compiler"]

# The two trees are the hand parser and the generated parser over one spec, and
# the generated half is code only the compiler feature writes.
[[test]]
name = "two_trees"
required-features = ["compiler"]

# The fixed point, and the compiler's own list of what a build must still learn
# to write. See `examples/bootstrap/main.rs`.
[[example]]
name = "bootstrap"
required-features = ["bootstrap"]
