[package]
description = "A DSL for specifying concrete syntax trees."
documentation = "https://docs.rs/unsyn"
edition = "2024"
license = "MIT"
name = "unsyn"
repository = "https://github.com/stylang/stylang/crates/unsyn"
version.workspace = true

[dependencies]
unicode-ident = "1.0.22"
parserc = { path = "../parserc", version = "^0.13", default-features = false, features = ["input"] }
serde = { version = "1.0.228", optional = true }
thiserror = { version = "2.0.17", optional = true }
proc-macro2 = { version = "^1", optional = true }
quote = { version = "^1", optional = true }

[dev-dependencies]
walkdir = "2"
syn = { version = "^2", features = ["full"] }

# The crate has two phases, and they are the two features that say so:
# `runtime` is what a generated grammar is compiled against, `codegen` is the
# DSL front end and the generator that writes one. Neither builds on the other:
# the generator only writes the names of runtime items into the text it emits,
# so a proc macro that produces a grammar leaves the runtime out of its own
# tree, and a crate that only keeps a generated file leaves the defaults off.
# The defaults carry both because a test here compiles a generated file, which
# needs a runtime to compile it against.
[features]
default = ["serde", "codegen", "runtime"]
runtime = []
codegen = ["dep:proc-macro2", "dep:quote", "dep:thiserror", "parserc/syntax"]
serde = ["dep:serde", "parserc/serde"]

[[test]]
name = "bootstrap"
required-features = ["codegen"]

[[test]]
name = "codegen"
required-features = ["codegen"]

[[test]]
name = "dump"
required-features = ["codegen"]

[[test]]
name = "generated"
required-features = ["codegen", "runtime"]
