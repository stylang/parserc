[package]
description = "A DSL for specifying concrete syntax trees."
documentation = "https://docs.rs/unsyn"
edition = "2024"
license = "MIT"
name = "unsyn"
repository = "https://github.com/stylang/stylang/crates/unsyn"
version.workspace = true

[dependencies]
unicode-ident = "1.0.22"
parserc = { path = "../parserc", version = "^0.14", default-features = false, features = ["input", "syntax"] }
serde = { version = "1.0.228", optional = true }
thiserror = "2.0.17"
proc-macro2 = "^1"
quote = "^1"

[dev-dependencies]
syn = { version = "^2", features = ["full"] }

# The crate is the build phase: the DSL front end and the generator that writes
# a grammar from it. There is nothing to switch off, because a generated file
# needs no unsyn at all — it names `parserc` items and nothing else, which is
# what lets a proc macro emit a grammar without dragging this crate into the
# tree of whatever compiles the result. `serde` is the only real choice left.
[features]
default = ["serde"]
serde = ["dep:serde", "parserc/serde"]
